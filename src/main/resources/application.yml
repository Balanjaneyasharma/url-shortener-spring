spring:
  application:
    name: url-shortener

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 4
    clean-disabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}${app.oauth2.callback-uri}"
            scope:
              - openid
              - profile
              - email
app:
  oauth2:
    callback-uri: /oauth/google/callback
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES}
      refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}
