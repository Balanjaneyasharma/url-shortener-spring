spring:
  application:
    name: url-shortener

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES}
      refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS}